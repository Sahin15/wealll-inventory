name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VPS and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/wealll-inventory || cd /var/www/wealll-inventory
            git remote set-url origin https://github.com/Sahin15/wealll-inventory.git
            git fetch origin
            git reset --hard origin/main
            chmod +x deploy.sh
            ./deploy.sh main
