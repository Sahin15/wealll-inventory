name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VPS and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/wealll-inventory || cd /var/www/wealll-inventory
            git remote set-url origin https://github.com/Sahin15/wealll-inventory.git
            git fetch origin
            git reset --hard origin/main
            chmod +x deploy.sh
            ./deploy.sh main
            
            echo "Searching for the rogue web root..."
            OLD_FILE=$(find /var/www /root /home -name "index-DYjwrKDD.js" 2>/dev/null | head -n 1)
            if [ -n "$OLD_FILE" ]; then
                WEB_ROOT=$(dirname $(dirname $OLD_FILE))
                echo "FOUND IT! Web root is $WEB_ROOT"
                rm -rf $WEB_ROOT/*
                cp -r ~/wealll-inventory/frontend/dist/* $WEB_ROOT/
                chown -R www-data:www-data $WEB_ROOT
            else
                # Fallback: aggressive copy to common places
                cp -r ~/wealll-inventory/frontend/dist/* /var/www/html/ 2>/dev/null || true
                cp -r ~/wealll-inventory/frontend/dist/* /var/www/inventory.wealll.com/ 2>/dev/null || true
                cp -r ~/wealll-inventory/frontend/dist/* /var/www/wealll-inventory/frontend/dist/ 2>/dev/null || true
            fi
